services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      HOA_DB_HOST: ${HOA_DB_HOST:-db}
      HOA_DB_PORT: ${HOA_DB_PORT:-5432}
      HOA_DB_NAME: ${HOA_DB_NAME:?Set HOA_DB_NAME in .env}
      HOA_DB_USER: ${HOA_DB_USER:?Set HOA_DB_USER in .env}
      HOA_DB_PASSWORD: ${HOA_DB_PASSWORD:?Set HOA_DB_PASSWORD in .env}
      HOA_JWT_SECRET: ${HOA_JWT_SECRET:?Set HOA_JWT_SECRET in .env}
      HOA_ADMIN_USERNAME: ${HOA_ADMIN_USERNAME:?Set HOA_ADMIN_USERNAME in .env}
      HOA_ADMIN_PASSWORD: ${HOA_ADMIN_PASSWORD:?Set HOA_ADMIN_PASSWORD in .env}
      NODE_ENV: ${NODE_ENV:-production}
      HOA_JWT_COOKIE_PREFIX: ${HOA_JWT_COOKIE_PREFIX:-hoa}
      HOA_JWT_ACCESS_TTL: ${HOA_JWT_ACCESS_TTL:-900}
      HOA_JWT_REFRESH_TTL: ${HOA_JWT_REFRESH_TTL:-604800}
      HOA_JWT_COOKIE_DOMAIN: ${HOA_JWT_COOKIE_DOMAIN:-}
      HOA_CORS_ALLOWED_ORIGINS: ${HOA_CORS_ALLOWED_ORIGINS:?Set HOA_CORS_ALLOWED_ORIGINS in .env}
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_backend
      - backend_db
    develop:
      watch:
        - path: ./backend
          action: rebuild

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    security_opt:
      - no-new-privileges:true
    networks:
      - public
      - frontend_backend

volumes:
  db_data:

networks:
  public:
  frontend_backend:
    internal: true
  backend_db:
    internal: true
